name: Security and build checks

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repair-site-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Chromium for accessibility checks
        run: npx playwright install --with-deps chromium

      - name: Full dependency audit
        run: npm audit --audit-level=high

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Lint, syntax, build, integration, and accessibility
        run: npm run check
